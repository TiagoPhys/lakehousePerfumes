# Job rotaperfume_pipeline — o pipeline da noite.
#
# Hoje ele tem DEZ tarefas. Ele cresce a cada prompt, sempre neste mesmo arquivo:
#
#   raw_conferencia      (prompt 1)         os 10 arquivos chegaram ao Volume?
#        |
#        v
#   bronze_ingestao      (prompt 2)         arquivo vira tabela, 1:1, sem regra
#        |
#        +--> silver_clientes          \
#        +--> silver_pedidos            |  prompt 3 — as quatro dependem só da
#        +--> silver_itens_e_produtos   |  bronze e rodam EM PARALELO entre si
#        +--> silver_crm_e_financeiro  /
#        |                                  (as quatro têm que terminar)
#        v
#   gold_dimensoes       (prompt 4 · hoje)  dimensões conformadas + _mapa_cliente
#        |
#        v
#   gold_fato_vendas     (prompt 4 · hoje)  o fato, grão de item de pedido
#        |
#        v
#   gold_marts           (prompt 4 · hoje)  um mart por diretoria, mesmo fato
#        |
#        v
#   testes               (prompt 4 · hoje)  9 testes — falhou, o job PARA
#        |
#        v
#   publicacao           (prompt 6)         dashboard e alerta
#
# A dependência é o conteúdo: a primeira falhar para o resto — que é exatamente o
# ponto da raw_conferencia. E o que NÃO tem dependência entre si roda junto: as
# quatro silver não se esperam, e é assim que o DAG desenha na tela.
#
# A gold é o contrário: dimensão antes do fato, fato antes dos marts, e os testes
# por último. Se um teste falhar, o que vier depois não roda — o dashboard fica
# com o dado de ONTEM, que é muito melhor do que o dado errado de hoje.
resources:
  jobs:
    rotaperfume_pipeline:
      name: rotaperfume_pipeline
      description: >-
        Pipeline da RotaPerfume: do arquivo bruto no Volume até a camada que a
        diretoria lê.

      # Sem job_clusters e sem existing_cluster_id: no Free Edition tudo é
      # serverless, e uma notebook_task sem compute declarado roda em serverless.
      tasks:
        - task_key: raw_conferencia
          description: Conferência de chegada do raw — falha alto se faltar arquivo.
          notebook_task:
            notebook_path: ../src/raw/conferencia.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: bronze_ingestao
          description: Arquivo vira tabela Delta — tudo texto, sem limpeza.
          # A ordem é o conteúdo: se a conferência de chegada falhar, a bronze
          # não roda. Melhor pipeline vermelho do que bronze com nove tabelas.
          depends_on:
            - task_key: raw_conferencia
          notebook_task:
            notebook_path: ../src/bronze/ingestao.py
            base_parameters:
              catalog: ${var.catalog}

        # As quatro da silver. Todas dependem só de bronze_ingestao e NENHUMA
        # depende da outra: o Databricks roda as quatro ao mesmo tempo.
        #
        # São sql_task rodando arquivo .sql no warehouse serverless — SQL puro,
        # legível na tela, sem notebook em volta. Por isso o caminho da tabela está
        # escrito por extenso dentro do SQL: sql_task passa parâmetro como VALOR,
        # nunca como identificador, então ${var.catalog} não funcionaria lá dentro.
        - task_key: silver_clientes
          description: >-
            Silver clientes — CNPJ normalizado para 14 dígitos, dedup por CNPJ
            mantendo o cadastro mais antigo, e o contrato declarado na tabela.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/01-clientes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_pedidos
          description: >-
            Silver pedidos — data convertida dos dois formatos, valor tipado e o
            cancelamento virando coluna em vez de regra na cabeça de quem consulta.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/02-pedidos.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_itens_e_produtos
          description: >-
            Silver produtos e itens_pedido — a devolução é sinalizada, nunca
            descartada, e o SKU descontinuado é exposto pelo join com produtos.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/03-itens-e-produtos.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: silver_crm_e_financeiro
          description: >-
            Silver CRM e financeiro — vendedores, carteira, oportunidades, visitas,
            pagamentos e estoque. A carteira órfã é exposta, não consertada.
          depends_on:
            - task_key: bronze_ingestao
          sql_task:
            file:
              path: ../src/silver/04-crm-e-financeiro.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # A gold, em cadeia. Aqui a ordem é obrigatória e não é estilo: o fato
        # lê as dimensões (inclusive gold._mapa_cliente), e os marts leem o fato.
        - task_key: gold_dimensoes
          description: >-
            Dimensões conformadas (cliente, produto, vendedor, calendário) e o
            _mapa_cliente, a ponte para o cadastro que a deduplicação descartou.
          depends_on:
            - task_key: silver_clientes
            - task_key: silver_pedidos
            - task_key: silver_itens_e_produtos
            - task_key: silver_crm_e_financeiro
          sql_task:
            file:
              path: ../src/gold/05-dimensoes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_fato_vendas
          description: >-
            O fato no grão de item de pedido, com o contrato escrito no topo do
            arquivo. Devolução fica dentro, com valor negativo e flag.
          depends_on:
            - task_key: gold_dimensoes
          sql_task:
            file:
              path: ../src/gold/06-fato-vendas.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        - task_key: gold_marts
          description: >-
            Um mart por diretoria — comercial, produto e financeiro. Os dois
            primeiros saem do MESMO fato, e por isso somam idêntico.
          depends_on:
            - task_key: gold_fato_vendas
          sql_task:
            file:
              path: ../src/gold/07-marts.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

        # Por último, e obrigatório. Teste que não quebra o job não é teste,
        # é relatório.
        - task_key: testes
          description: >-
            Os 9 testes de qualidade. Cada um imprime nome, valor calculado e
            esperado; o primeiro que falhar aborta a tarefa com raise_error.
          depends_on:
            - task_key: gold_marts
          sql_task:
            file:
              path: ../src/gold/08-testes.sql
              source: WORKSPACE
            warehouse_id: ${var.warehouse_id}

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
        # No target dev isto vira PAUSED pelo presets do databricks.yml.

      queue:
        enabled: true
